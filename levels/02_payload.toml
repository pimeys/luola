# 02 — the payload. The core sits in a dead-end chamber bottom-right; haul it
# out through the 110 px throat with the rod swinging. The hangar deck opens
# onto a 180 px drop shaft: the descent is free, the climb home is not.
#
# The cave is a pile of discs, not a box: every mass is a `blob` (a lumpy spine)
# or a `chain` (a disc swept along one), so the walls wander the way rock does.
# The outer ring is one closed blob — the level's own wall, organically wavy on
# the inside — plus a `border` brush, which fills the grid's margin so the cave
# has an outer wall even where the ring's lumps fall short of the structural rock
# casing (`sim::terrain`). There are no boundary brushes any more.
#
# Rock is the hangar deck over the core chamber — dirt there and the core could
# be blasted straight up to the exit at (2030,515), which is exactly the 110 px
# throat the level is built around — the little lip that keeps the lake off the
# western landing pad, and three embedded boulders. Everything else is dirt: the
# bulkheads and their throat jaws, the western deck (which is also the lake's
# floor and its plug), the strut, the stalactites and the sump slope.

name = "Payload"
briefing = "Torch the core loose and tow it home; the throat out is barely wider than the rod."
gravity = 90.0
fuel = 120.0
require_pod = true
player = { pos = [245, 245], angle = 0.0 }

# --- the loadout: what a base hands out, and what you launch with -------------
#
# The payload swings and every throat is measured for the rod, so the pool is the
# three tools that make a tow tractable: something to anchor the swing, something
# to widen the throat, and something to build a ledge to park on. The clock is the
# climb rate under tow (`docs/design.md` §5), so each one buys route, not damage.
[weapons]
available = [
    "harpoon",  # bites the throat wall and reels you in: the anchor that takes the payload's swing out
    "digger",   # the 110 px throat is dirt pinned on both jaws, so the drill is how the rod gets wider room
    "dirtball", # adds terrain, so the rod can wait on a shelf you build while you line up the next corner
]
start = "harpoon"

# --- the level's own wall: one closed, lumpy ring -----------------------------
[[wall]]
kind = "blob"
points = [[70.0, 70.0], [1100.0, 80.0], [2170.0, 70.0], [2160.0, 615.0], [2170.0, 1230.0], [1100.0, 1220.0], [70.0, 1230.0], [80.0, 615.0], [70.0, 70.0]]
radius = 70.0
lumps = 90

# The wall of the cave, as a parameter: a rounded ring inside a rectangular grid
# traps air in all four corners, and air nobody can fly into is a hole in the map.
# This fills the margin behind the ring, square, so nothing survives out there.
[[wall]]
kind = "border"
thickness = 110.0

