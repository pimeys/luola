# 03 — the reactor run. The core sits in the deep hall under three guns; the exit
# only unseals when it goes critical and it is on the far side of the map.
# Crosswind blows east.
#
# The cave is a pile of discs, not a box: every mass is a `blob` (a lumpy spine)
# or a `chain` (a disc swept along one). The level's own wall is one closed lumpy
# ring plus the same ring swept square at its full radius, so it meets the
# structural rock casing (`sim::terrain`) with no sliver of air outside it.
#
# Rock is that casing, the reactor chamber's west wall (dirt there and the core
# could be shot through a dug hole from the next room without ever entering the
# hall under the guns) and the core's plinth, which is what keeps the reactor
# standing clear when the tank comes down. Everything else is dirt the pilot can
# tunnel through: the struts and their throat jaws, both decks, the lip.
#
# The tank is a puddle on the east deck, in the room above the hall: the deck is
# its floor and the strut and the shell are its walls. Measured, blasting the deck
# pours it into the hall where it settles ~25 px deep (waterline y ~1115), behind the lip at y 1080 —
# and the core stands at y 1090, 25 px above that waterline, so the run home never
# needs this and the core never gets wet. Nothing stands *in* the pool: water levels by
# column totals, so a raised structure inside one just gets wet up to the surface
# around it (`docs/design.md` §5).

name = "Reactor Run"
briefing = "Blow the core, then outrun the blast to the surface lock on the west side."
gravity = 95.0
fuel = 130.0
wind = [6.0, 0.0]
exit_locked = true
player = { pos = [200, 200], angle = 0.0 }

# --- the loadout: what a base hands out, and what you launch with -------------
#
# The heavy kit, and the only cave it belongs in. Everything but the casing and
# the chamber wall is dirt, so the blast weapons cannot breach the level itself —
# they only shape it, which is what the run needs: the struts and both decks are
# the drill's, the tank on the east deck drops into the hall when the demolition
# goes off, and five guns and a reactor blast are why the board carries a bubble.
[weapons]
available = [
    "digger",            # the struts, both decks and the hall's lid are dirt: the drill is the route-maker
    "plastic explosive", # the demolition charge: it drops the east deck and pours the tank into the hall
    "electric blast",    # knocks out every turret in radius — the answer to the hall's gun line
    "shield",            # the bubble that has to hold for the run home across five turrets and the blast
    "nuke",              # the expensive one-shot: the hall under three guns goes in a single press
    "torpedo",           # the one heavy round that still flies once the tank has flooded the hall
]
start = "digger"

# --- the level's own wall: one closed, lumpy ring -----------------------------
[[wall]]
kind = "blob"
points = [[60.0, 60.0], [1200.0, 45.0], [2340.0, 60.0], [2355.0, 650.0], [2340.0, 1240.0], [1200.0, 1255.0], [60.0, 1240.0], [45.0, 650.0], [60.0, 60.0]]
radius = 100.0
lumps = 110

# The wall of the cave, as a parameter: a rounded ring inside a rectangular grid
# traps air in all four corners, and air nobody can fly into is a hole in the map.
[[wall]]
kind = "border"
thickness = 160.0

# --- the western strut: the wall of the descent, in three pieces with two
